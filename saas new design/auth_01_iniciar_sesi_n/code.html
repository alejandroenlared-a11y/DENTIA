<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F6F7;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            font-size: 18px;
        }
        .login-card {
            border: 1px solid #D9DEE3;
            box-shadow: none;
        }
        input:focus {
            outline: none !important;
            border-color: #004268 !important;
            box-shadow: none !important;
        }
        .btn-primary {
            transition: all 0.15s ease-in-out;
        }

            transform: scale(0.98);

<body class="min-h-screen flex items-center justify-center p-4">
<!-- Auth Shell Suppression: Per instructions, Navigation shell is suppressed for Transactional/Login screens -->
<main class="w-full max-w-[400px]">
<div class="login-card bg-surface p-8 flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-8 w-full flex flex-col items-center">
<img alt="DENTIA Dental Software Logo" class="h-16 w-auto mb-2" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdGJCbL0YqlSXq7wDb4fXU65yXeijgSdyQLjw_GcHyEFSZz1pLhGUZuBn50jwxkWXnXfInsPyPjIE64PU_oocYp1lNzXD03Etrbp_qWkZz1hpGFPUwG4-Qryq7V8mhluVCtE3h0mtNCRJ-QI-ksi5XrhoSjdm2ScwEu9yfxgy5XBjbAEvo5tn6i2R-ZxrQpYjIMIfJxLN-Qz7Pa2DQj8zO68nHTrqFkB81RxXbqPl4-r2o3bJaD6By"/>
<div class="text-center">
<span class="font-headline-md text-headline-md font-bold text-primary block uppercase tracking-tight">DENTIA</span>
<span class="font-label-xs text-label-xs text-outline block -mt-1">Dental Software</span>
</div>
</div>
<div class="w-full mb-6">
<h1 class="font-headline-lg text-headline-lg text-text-primary text-center">Iniciar sesión</h1>
</div>
<form class="w-full space-y-4" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-1">
<label class="font-label-xs text-label-xs text-secondary uppercase" for="email">Email</label>
<div class="relative">
<input class="w-full h-10 px-3 bg-surface border border-border-base font-body-md text-body-md text-text-primary rounded-none transition-colors" id="email" name="email" placeholder="ejemplo@clinica.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<label class="font-label-xs text-label-xs text-secondary uppercase" for="password">Contraseña</label>
<div class="relative group">
<input class="w-full h-10 px-3 pr-10 bg-surface border border-border-base font-body-md text-body-md text-text-primary rounded-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Device -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded-none border-border-base text-primary focus:ring-0 cursor-pointer" type="checkbox"/>
<span class="font-body-sm text-body-sm text-secondary group-hover:text-text-primary transition-colors">Recordar dispositivo</span>
</label>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="btn-primary w-full h-10 bg-primary text-on-primary font-body-md text-body-md font-semibold rounded-none hover:bg-primary-container hover:text-on-primary-container flex items-center justify-center gap-2" type="submit">
                        Entrar
                        <span class="material-symbols-outlined text-[16px]">login</span>
</button>
</div>
<!-- Footer Link -->
<div class="text-center pt-4">
<a class="font-body-sm text-body-sm text-primary hover:underline transition-all" href="#">
                        He olvidado mi contraseña
                    </a>
</div>
</form>
</div>
<!-- System Status / Info -->
<div class="mt-8 text-center space-y-2">
<p class="font-label-xs text-label-xs text-outline uppercase tracking-widest">
                Entorno Seguro Protegido
            </p>
<div class="flex justify-center gap-4 text-outline font-body-sm text-body-sm">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">lock</span>
                    SSL 256-bit
                </span>
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">verified_user</span>
                    v4.2.1
                </span>
</div>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('password-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Simple atmospheric interaction for the background
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 5;
            const y = (e.clientY / window.innerHeight) * 5;
            document.body.style.backgroundPosition = `${x}px ${y}px`;
        });
    </script>
